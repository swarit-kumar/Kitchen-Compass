
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitchencompass"
version = "0.1.0"
description = "Context-aware recipe recommendation and adaptation"
requires-python = ">=3.11,<3.12"

[tool.setuptools.packages.find]
include = ["kitchencompass*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
